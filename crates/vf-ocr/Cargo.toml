[package]
name = "vf-ocr"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vf-project = { path = "../vf-project" }
vf-text = { path = "../vf-text" }
vf-image = { path = "../vf-image" }
opencv = { version = "0.93", default-features = false, features = ["clang-runtime", "imgproc"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic"] }
thiserror.workspace = true

[dev-dependencies]
opencv = { version = "0.93", default-features = false, features = ["clang-runtime", "imgcodecs"] }
