<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeilFrame · UI 原型</title>
<style>
:root{--ink:#1f2328;--sub:#6b7079;--mute:#9aa0a8;--line:#e6e6e3;--bg:#f5f5f3;--card:#ffffff;--acc:#2f5bd3;--acc-soft:#eef2fb}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{border-color:#c9cbd0}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.ghost{border-color:transparent;background:transparent;color:var(--sub)}
button:disabled{opacity:.4;cursor:default}
button.sm{padding:3px 10px;font-size:12px}
.mdi{width:18px;height:18px;fill:currentColor;flex:0 0 auto;vertical-align:middle}
button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.icon-btn{width:36px;height:36px;padding:0;border-radius:50%}
.tic{display:inline-flex;flex:0 0 auto;width:18px;height:18px}
.tic .mdi{width:18px;height:18px}
.status{display:inline-flex;align-items:center;gap:6px;color:var(--sub)}
.status .mdi{width:16px;height:16px}
input[type=text],select{border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%;background:var(--card)}
input[type=range]{width:100%;accent-color:var(--acc);margin:4px 0 0}
input[type=checkbox]{accent-color:var(--acc);margin:0 6px 0 0}
.muted{color:var(--sub)}
.small{font-size:12px}
.hide{display:none !important}
.sp{flex:1}

header{height:52px;display:flex;align-items:center;gap:32px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line);flex:0 0 auto}
.logo{font-weight:700;letter-spacing:.2px}
.tabs{display:flex;gap:6px;height:100%}
.tabs button{border:0;border-radius:0;background:none;padding:0 10px;color:var(--sub);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}

.view{display:none;flex:1;min-height:0}
.view.on{display:block}
#work.on{display:grid;grid-template-columns:240px minmax(0,1fr) 280px;grid-template-rows:minmax(0,1fr) auto}

aside{background:var(--card);padding:18px;overflow:auto;min-height:0}
aside.l{border-right:1px solid var(--line)}
aside.r{border-left:1px solid var(--line)}
.sec{font-size:12px;color:var(--mute);font-weight:600;margin:0 0 10px}

.tg{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer}
.tg:hover{background:#f6f6f4}
.tg.on{background:var(--acc-soft)}
.tg .name{flex:1;min-width:0}
.tg small{display:block;color:var(--sub);font-size:12px}
.tg.off{opacity:.5}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 auto}

.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:20px}
.frame{position:relative;width:min(100%,calc((100vh - 340px) * 16 / 9));aspect-ratio:16/9;background:#1d2027;border-radius:8px;overflow:hidden}
.shape{position:absolute;background:rgba(255,255,255,.07);border-radius:4px}
.box{position:absolute;border:2px solid var(--c);border-radius:3px;box-sizing:border-box;cursor:pointer}
.box.pending{border-style:dashed}
.box.low{border-style:dotted}
.box.sel{box-shadow:0 0 0 2px #fff}
.box .lbl{position:absolute;left:-2px;top:-20px;background:var(--c);color:#fff;font-size:11px;padding:0 6px;border-radius:3px;white-space:nowrap}
.box .fx{position:absolute;inset:calc(var(--pad) * -1);border-radius:3px;pointer-events:none}
.fx.mosaic{background:repeating-conic-gradient(#6b7079 0 25%,#b8bcc4 0 50%) 0 0/var(--blk) var(--blk)}
.fx.blur{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.fx.solid{background:var(--c)}

.transport{display:flex;align-items:center;gap:14px;padding:0 20px 16px}
.time{font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px}
.hintline{margin-left:auto;font-size:12px;color:var(--mute)}

.tl{grid-column:1 / -1;background:var(--card);border-top:1px solid var(--line);height:240px;display:flex;flex-direction:column;min-height:0}
.tl-top{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line)}
.tl-body{flex:1;min-height:0;overflow:auto;position:relative;padding:6px 0}
.row{display:flex;height:30px;align-items:center}
.lab{width:120px;flex:0 0 120px;padding:0 20px;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;overflow:hidden;font-size:13px}
.trk{flex:1;position:relative;height:100%;cursor:pointer;margin-right:20px}
.blk{position:absolute;top:6px;bottom:6px;border-radius:3px;background:var(--c);cursor:pointer;min-width:3px}
.blk.pending{background:transparent;border:1.5px dashed var(--c)}
.blk.low{background:repeating-linear-gradient(45deg,var(--c) 0 3px,transparent 3px 6px);border:1px solid var(--c)}
.blk.sel{outline:2px solid var(--ink);outline-offset:1px}
.unscan{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(-45deg,transparent 0 6px,rgba(0,0,0,.035) 6px 12px);pointer-events:none}
.ph{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);pointer-events:none}
.bar{height:4px;width:140px;background:#eceeef;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}

.field{margin:14px 0}
.field>label{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;padding:5px 4px;background:var(--card)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.kv{display:flex;justify-content:space-between;padding:4px 0;font-size:13px}
.kv span{color:var(--sub)}
.row-btns{display:flex;gap:8px;margin:12px 0 8px;flex-wrap:wrap}
.check{display:flex;align-items:center;font-size:13px;margin:8px 0;cursor:pointer}
.line{height:1px;background:var(--line);margin:16px 0}
.notice{background:#fbf8ee;border:1px solid #efe4bf;border-radius:8px;padding:10px 12px;font-size:13px;margin-top:16px}

.page{padding:28px 36px;overflow:auto;flex:1;min-height:0;display:none}
.page.on{display:block}
.page h2{font-size:18px;margin:0 0 16px}
.stats{display:flex;gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;min-width:150px}
.stat b{display:block;font-size:22px;font-weight:600}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px}
.tbl th,.tbl td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:13px}
.tbl th{color:var(--sub);font-weight:500;background:#fafaf9}
.tbl tr:last-child td{border-bottom:0}

#modal{position:fixed;inset:0;background:rgba(20,22,26,.25);display:flex;align-items:center;justify-content:center;z-index:20}
.dialog{background:var(--card);border-radius:12px;padding:22px;width:420px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.dialog h3{margin:0 0 12px;font-size:16px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1f2328;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:30}
</style>
</head>
<body>

<header>
  <div class="logo">VeilFrame</div>
  <nav class="tabs">
    <button class="on" data-v="work">工作台</button>
    <button data-v="queue">批量队列</button>
  </nav>
  <div class="sp"></div>
  <button id="btnExport" class="primary"><i data-ic="ExportVariant"></i>导出</button>
</header>

<!-- 工作台 -->
<div id="work" class="view on">
  <aside class="l">
    <div class="sec">目标</div>
    <div id="targets"></div>
    <div style="margin-top:14px"><button id="btnNew" class="sm"><i data-ic="Plus"></i>新建目标</button></div>
  </aside>

  <section class="center">
    <div class="stage">
      <div class="frame">
        <div class="shape" style="left:8%;top:12%;width:24%;height:14%"></div>
        <div class="shape" style="left:80%;top:5%;width:12%;height:12%;border-radius:4px"></div>
        <div class="shape" style="left:30%;top:62%;width:16%;height:9%"></div>
        <div class="shape" style="left:52%;top:68%;width:22%;height:14%"></div>
        <div id="boxes"></div>
      </div>
    </div>
    <div class="transport">
      <button id="btnBack" class="icon-btn" title="上一帧 (←)"><i data-ic="StepBackward"></i></button>
      <button id="btnPlay" class="icon-btn primary" title="播放 (Space)"><i data-ic="Play"></i></button>
      <button id="btnFwd" class="icon-btn" title="下一帧 (→)"><i data-ic="StepForward"></i></button>
      <span class="time" id="time"></span>
      <span class="hintline">Space 播放 · ← → 逐帧 · F 下一待确认 · Enter 接受 · Delete 否决 · Ctrl+Z 撤销</span>
    </div>
  </section>

  <aside class="r" id="side"></aside>

  <section class="tl">
    <div class="tl-top">
      <b>时间轴</b>
      <button id="btnPend" class="sm"><i data-ic="FilterVariant"></i>只看待确认</button>
      <span class="sp"></span>
      <span class="muted small" id="scanText"></span>
      <div class="bar" style="width:120px"><i id="scanBar"></i></div>
      <button id="btnScan" class="sm">重新扫描</button>
    </div>
    <div class="tl-body" id="tlBody">
      <div id="tlRows"></div>
      <div id="unscan" class="unscan"></div>
      <div id="ph" class="ph"></div>
    </div>
  </section>
</div>

<!-- 批量队列 -->
<div id="queue" class="page">
  <h2>批量队列</h2>
  <table class="tbl">
    <thead><tr><th>视频</th><th>时长</th><th>状态</th><th>进度</th><th>检出段</th><th>待确认</th></tr></thead>

      <tr><td>产品演示_final.mov</td><td>03:45</td><td><span class="status"><i data-ic="CheckCircleOutline"></i>待复核</span></td><td><div class="bar"><i style="width:100%"></i></div></td><td>18</td><td>4</td></tr>
      <tr><td>街拍_素材07.mp4</td><td>12:08</td><td><span class="status"><i data-ic="ProgressClock"></i>排队</span></td><td><div class="bar"><i style="width:0"></i></div></td><td>—</td><td>—</td></tr>

    </tbody>
  </table>
</div>

<div id="modal" class="hide"></div>
<div id="toast" class="hide"></div>

let uid = 100, playTimer = null, scanTimer = null, toastTimer = null;
const undoStack = [];

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = t => { const m = Math.floor(t/60), s = t - m*60; return String(m).padStart(2,'0') + ':' + s.toFixed(1).padStart(4,'0'); };
const nid = p => p + (uid++);
const tgt = id => targets.find(t => t.id === id);
const seg = id => segments.find(s => s.id === id);
const isPend = s => s.status === 'pending' || s.status === 'low';
const front = () => S.prog / 100 * DUR;
const live = s => s.t0 <= front() && !!tgt(s.tg) && tgt(s.tg).on;

function toast(msg){
  const el = $('#toast');
  el.textContent = msg;
  el.classList.remove('hide');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hide'), 2200);
}

/* ---------- 撤销 ---------- */
const snap = () => JSON.stringify({targets, segments});
function commit(fn){
  undoStack.push(snap());
  if(undoStack.length > 100) undoStack.shift();
  fn();
  refresh();
}
function doUndo(){
  if(!undoStack.length) return toast('没有可撤销的操作');
  const d = JSON.parse(undoStack.pop());
  targets = d.targets; segments = d.segments;
  if(!seg(S.sel)) S.sel = null;
  if(!tgt(S.tg)) S.tg = targets[0] ? targets[0].id : null;
  refresh();
}

/* ---------- 渲染 ---------- */
function renderTargets(){
  $('#targets').innerHTML = targets.map(t => {
    const list = segments.filter(s => s.tg === t.id && live(s) && s.status !== 'rejected');
    const p = list.filter(isPend).length;
    const sub = !t.on ? '未启用' : list.length === 0 ? '未检出' : list.length + ' 段' + (p ? ' · ' + p + ' 待确认' : '');
    return '<div class="tg' + (S.tg === t.id ? ' on' : '') + (t.on ? '' : ' off') + '" data-tg="' + t.id + '">' +
      '<input type="checkbox" data-on="' + t.id + '"' + (t.on ? ' checked' : '') + '>' +
      '<span class="tic" style="color:' + t.color + '">' + ic(TYPE_ICON[t.type]) + '</span>' +
      '<div class="name">' + esc(t.name) + '<small>' + esc(t.type) + ' · ' + sub + '</small></div></div>';
  }).join('');
}
function renderFrame(){
  const f = front();
  let h = '';
  if(S.t <= f) for(const s of segments){
    const t = tgt(s.tg);
    if(!t || !t.on || s.status === 'rejected' || s.t0 > f) continue;
    if(S.t < s.t0 || S.t > s.t1) continue;
    const b = s.box;
    h += '<div class="box ' + s.status + (S.sel === s.id ? ' sel' : '') + '" data-seg="' + s.id + '" style="' +
      'left:' + b.x + '%;top:' + b.y + '%;width:' + b.w + '%;height:' + b.h + '%;--c:' + t.color + ';--pad:' + t.pad + 'px;--blk:' + (6 + t.strength*14) + 'px">' +
      '<div class="fx ' + t.kind + '"></div><span class="lbl">' + esc(t.name) + ' ' + s.conf.toFixed(2) + '</span></div>';
  }
  $('#boxes').innerHTML = h;
}
function renderTimeline(){
  const f = front();
  $('#tlRows').innerHTML = targets.map(t => {
    let blocks = '';
    for(const s of segments){
      if(s.tg !== t.id || s.t0 > f || s.status === 'rejected') continue;
      if(S.onlyPend && !isPend(s)) continue;
      const end = Math.min(s.t1, f);
      blocks += '<div class="blk ' + s.status + (S.sel === s.id ? ' sel' : '') + '" data-seg="' + s.id + '" style="' +
        'left:' + (s.t0/DUR*100) + '%;width:' + Math.max(0.4, (end - s.t0)/DUR*100) + '%;--c:' + t.color + '"></div>';
    }
    return '<div class="row"><div class="lab" data-lab="' + t.id + '" style="' + (t.on ? '' : 'opacity:.4') + '">' +
      '<span class="dot" style="background:' + t.color + '"></span>' + esc(t.name) + '</div>' +
      '<div class="trk" data-trk="' + t.id + '">' + blocks + '</div></div>';
  }).join('');
  $('#btnPend').classList.toggle('on', S.onlyPend);
  $('#unscan').style.display = f >= DUR ? 'none' : 'block';
  $('#unscan').style.left = 'calc(120px + (100% - 120px) * ' + (f/DUR) + ')';
}
function updateTime(){
  $('#ph').style.left = 'calc(120px + (100% - 120px) * ' + (S.t/DUR) + ')';
  $('#time').textContent = fmt(S.t) + ' / ' + fmt(DUR);
  $('#btnPlay').innerHTML = ic(S.playing ? 'Pause' : 'Play');
}
function renderStatus(){
  const found = segments.filter(x => live(x) && x.status !== 'rejected').length;
  $('#scanBar').style.width = S.prog + '%';
  if(S.scanning){
    $('#scanText').textContent = '扫描中 ' + S.prog.toFixed(0) + '% · 已发现 ' + found + ' 段';
    $('#btnScan').innerHTML = ic('StopCircleOutline') + '取消';
  } else {
    $('#scanText').textContent = (S.prog >= 100 ? '扫描完成' : '已取消，已完成部分保留') + ' · 共 ' + found + ' 段';
    $('#btnScan').innerHTML = ic('Refresh') + '重新扫描';
  }
}

      '<input type="range" min="0.30" max="0.95" step="0.01" value="' + t.thr + '" data-r="thr"></div>' +
    '<div class="sec" style="margin-top:22px">打码</div>' +
    '<div class="field"><div class="seg">' +
      KINDS.map(k => '<button data-set="kind" data-v="' + k[0] + '" class="' + (t.kind === k[0] ? 'on' : '') + '">' + k[1] + '</button>').join('') +
    '</div></div>' +
    '<div class="field"><label>强度 <span data-out="str">' + t.strength.toFixed(2) + '</span></label>' +
      '<input type="range" min="0.1" max="1" step="0.05" value="' + t.strength + '" data-r="str"></div>' +
    '<div class="field"><label><span>外扩</span><span data-out="pad">' + t.pad + ' px</span></label>' +
      '<input type="range" min="0" max="30" step="1" value="' + t.pad + '" data-r="pad"></div>';
  if(t.on && n === 0)
    html += '<div class="notice">' + ic('AlertCircleOutline') + '当前未检出。可以降低阈值，或换一种匹配模式。<div style="margin-top:8px"><button class="sm" data-act="lower">' + ic('TuneVariant') + '降低阈值 −0.1</button></div></div>';
  $('#side').innerHTML = html;
}

/* 只更新画面、时间轴和播放头，避免播放/扫描时重建右侧面板 */
function tick(){ renderFrame(); renderTimeline(); renderStatus(); updateTime(); }
function refresh(){ renderTargets(); tick(); renderSide(); }
function seek(t){ S.t = clamp(t, 0, DUR); renderFrame(); updateTime(); }

/* ---------- 播放 / 扫描 ---------- */
function setPlay(v){
  S.playing = v;
  clearInterval(playTimer); playTimer = null;
  if(v) playTimer = setInterval(() => {
    if(S.t >= DUR){ setPlay(false); return; }
    seek(S.t + 0.1);
  }, 100);
  updateTime();
}
function startScan(){
  clearInterval(scanTimer);
  S.prog = 0; S.scanning = true;
  scanTimer = setInterval(() => {
    S.prog = Math.min(100, S.prog + SCAN_RATE);
    if(S.prog >= 100){ stopScan(); toast('扫描完成'); refresh(); return; }
    tick();
  }, 100);
  refresh();
}
function stopScan(){ clearInterval(scanTimer); scanTimer = null; S.scanning = false; }

/* ---------- 段操作 ---------- */
function act(a){
  const s = seg(S.sel);
  if(!s) return toast('先选中一个检测段');
  if(a === 'accept'){
    if(s.status !== 'confirmed') commit(() => { seg(s.id).status = 'confirmed'; });
  } else if(a === 'reject'){
    if(s.status === 'rejected') return;
    const tg = tgt(s.tg);
    commit(() => {
      seg(s.id).status = 'rejected';
      if(S.neg) tg.thr = +Math.min(0.95, tg.thr + 0.01).toFixed(2);
    });
    S.sel = null; refresh();
    toast(S.neg ? '已否决，「' + tg.name + '」阈值 +0.01' : '已否决');
  } else if(a === 'delete'){
    commit(() => { segments = segments.filter(x => x.id !== s.id); });
    S.sel = null; refresh();
  }
}
function nextPending(){
  const list = segments.filter(s => isPend(s) && live(s)).sort((a, b) => a.t0 - b.t0);
  if(!list.length) return toast('没有待确认段');
  const nx = list.find(s => s.t0 > S.t + 0.01) || list[0];
  S.sel = nx.id; S.tg = nx.tg;
  seek(nx.t0); refresh();
}

/* ---------- 弹窗 ---------- */
function openModal(html){
  $('#modal').innerHTML = '<div class="dialog">' + html + '</div>';
  $('#modal').classList.remove('hide');
}
function closeModal(){ $('#modal').classList.add('hide'); }

/* ---------- 事件 ---------- */
$$('.tabs button').forEach(b => b.addEventListener('click', () => {
  $$('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['work','queue'].forEach(id => $('#' + id).classList.toggle('on', id === b.dataset.v));
  if(b.dataset.v === 'work') refresh();
}));
$('#btnPlay').addEventListener('click', () => setPlay(!S.playing));
$('#btnBack').addEventListener('click', () => seek(S.t - 1/30));
$('#btnFwd').addEventListener('click', () => seek(S.t + 1/30));
$('#btnScan').addEventListener('click', () => {
  if(S.scanning){ stopScan(); toast('已取消，已完成部分保留'); refresh(); }
  else startScan();
});
$('#btnPend').addEventListener('click', () => { S.onlyPend = !S.onlyPend; refresh(); });
$('#btnExport').addEventListener('click', () => {
  const pend = segments.filter(s => isPend(s) && live(s)).length;
  openModal('<h3>导出</h3>' +
    '<p class="muted small" style="margin:0 0 12px">仍有 ' + pend + ' 段待确认，默认按打码处理（召回优先）。</p>' +
    '<div class="field"><label>编码器</label><select><option>NVENC（自动）</option><option>QSV</option><option>AMF</option><option>x264 软编</option></select></div>' +
    '<label class="check"><input type="checkbox" checked>智能渲染（仅重编码含打码的 GOP）</label>' +
    '<div class="foot"><button data-m="close">取消</button><button class="primary" data-m="export">' + ic('ExportVariant') + '导出</button></div>');
});
$('#btnNew').addEventListener('click', () => openModal('<h3>新建目标</h3>' +
  '<div class="field"><label>名称</label><input type="text" id="newName" placeholder="例如：机密"></div>' +
  '<div class="field"><label>类型</label><select id="newType"><option>文本</option><option>图像</option><option>区域</option></select></div>' +
  '<div class="foot"><button data-m="close">取消</button><button class="primary" data-m="new">' + ic('Plus') + '添加</button></div>'));
$('#modal').addEventListener('click', e => {
  if(e.target.id === 'modal') return closeModal();
  const b = e.target.closest('[data-m]');
  if(!b) return;
  const m = b.dataset.m;
  if(m === 'close') return closeModal();
  if(m === 'export'){ closeModal(); return toast('已开始导出（原型未接入渲染）'); }
  if(m === 'new'){
    const name = $('#newName').value.trim();
    if(!name) return toast('请输入名称');
    const type = $('#newType').value;
    closeModal();
    const id = nid('t');
    commit(() => {
      targets.push({id, name, type, color: COLORS[targets.length % COLORS.length], on:true, mode:'标准', thr:0.6, kind:'mosaic', strength:0.6, pad:6});
      S.tg = id; S.sel = null;
    });
    toast('已添加「' + name + '」，暂无检出段');
  }
});

// 目标列表
$('#targets').addEventListener('click', e => {
  const cb = e.target.closest('input[data-on]');
  if(cb){ const t = tgt(cb.dataset.on); return commit(() => { t.on = cb.checked; }); }
  const row = e.target.closest('[data-tg]');
  if(row){ S.tg = row.dataset.tg; S.sel = null; refresh(); }
});

// 时间轴
$('#tlRows').addEventListener('click', e => {
  const blk = e.target.closest('.blk');
  if(blk){ const s = seg(blk.dataset.seg); S.sel = s.id; S.tg = s.tg; seek(s.t0); return refresh(); }
  const lab = e.target.closest('[data-lab]');
  if(lab){ S.tg = lab.dataset.lab; S.sel = null; return refresh(); }
  const trk = e.target.closest('[data-trk]');
  if(trk){ const r = trk.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * DUR); }
});

// 画面里的框
$('#boxes').addEventListener('click', e => {
  const box = e.target.closest('.box');
  if(!box) return;
  const s = seg(box.dataset.seg);
  S.sel = s.id; S.tg = s.tg; refresh();
});

// 右侧面板
const side = $('#side');
side.addEventListener('click', e => {
  const b = e.target.closest('button');
  if(!b) return;
  const t = tgt(S.tg);
  if(b.dataset.set === 'mode') return commit(() => { t.mode = b.dataset.v; });
  if(b.dataset.set === 'kind') return commit(() => { t.kind = b.dataset.v; });
  if(b.dataset.act === 'accept') return act('accept');
  if(b.dataset.act === 'reject') return act('reject');
  if(b.dataset.act === 'delete') return act('delete');
  if(b.dataset.act === 'lower') return commit(() => { t.thr = Math.max(0.3, +(t.thr - 0.1).toFixed(2)); });
});
side.addEventListener('change', e => {
  if(e.target.id === 'neg') S.neg = e.target.checked;
});
side.addEventListener('pointerdown', e => {
  if(e.target.matches('input[type=range]')) undoStack.push(snap());
});
side.addEventListener('input', e => {
  const t = tgt(S.tg), el = e.target;
  if(!t) return;
  if(el.dataset.name !== undefined){
    t.name = el.value;
    renderTargets(); renderTimeline(); renderFrame();
    return;
  }
  if(el.dataset.r){
    const v = parseFloat(el.value);
    if(el.dataset.r === 'thr') t.thr = v;
    if(el.dataset.r === 'str') t.strength = v;
    if(el.dataset.r === 'pad') t.pad = v;
    const out = side.querySelector('[data-out="' + el.dataset.r + '"]');
    if(out) out.textContent = el.dataset.r === 'pad' ? v + ' px' : v.toFixed(2);
    renderFrame();
  }
});

// 键盘
document.addEventListener('keydown', e => {
  if(e.target.matches('input[type=text],select')) return;
  if(!$('#modal').classList.contains('hide')){
    if(e.key === 'Escape') closeModal();
    return;
  }
  if(!$('#work').classList.contains('on')) return;
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); return doUndo(); }
  switch(e.key){
    case ' ': e.preventDefault(); setPlay(!S.playing); break;
    case 'ArrowLeft': e.preventDefault(); seek(S.t - (e.shiftKey ? 1 : 1/30)); break;
    case 'ArrowRight': e.preventDefault(); seek(S.t + (e.shiftKey ? 1 : 1/30)); break;
    case 'Enter': act('accept'); break;
    case 'Delete': case 'Backspace': e.preventDefault(); act('reject'); break;
    default: if(e.key.toLowerCase() === 'f') nextPending();
  }
});

// 点击按钮后移除焦点，避免 Enter / Space 同时触发按钮和快捷键
document.addEventListener('click', e => { const b = e.target.closest('button'); if(b) b.blur(); });

hydrate(document);
refresh();
</script>
</body>
</html>
