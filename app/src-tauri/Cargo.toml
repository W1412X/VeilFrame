[package]
name = "veilframe"
version = "0.2.2"
edition = "2021"
publish = false

# 独立的 workspace：Tauri 依赖 WebKitGTK 等系统库，不随根 workspace 的 cargo test 编译。
[workspace]

[lib]
name = "veilframe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
vf-project = { path = "../../crates/vf-project" }
vf-session = { path = "../../crates/vf-session" }
vf-export = { path = "../../crates/vf-export" }
vf-media = { path = "../../crates/vf-media" }
vf-queue = { path = "../../crates/vf-queue" }
