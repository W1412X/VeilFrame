# 诊断（probe 分支）：三平台全链路复现到 tauri build（Release 第15步的失败点），
# 日志（tail + error 提取）提交到 probe-log-* 分支，绕开 Actions 日志的管理员权限。
# 每步保留真实退出码；日志分支的提交不会触发本 workflow。
name: Probe

on:
  push:
    branches: [probe]

permissions:
  contents: write

jobs:
  macos-build:
    name: macOS 全链路至 tauri build
    runs-on: macos-15
    timeout-minutes: 120
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKGRS_TRIPLET: arm64-osx-static
      VCPKGRS_DYNAMIC: "0"
      OPENCV_MSVC_CRT: dynamic
      OPENCV_VERSION: "4.10.0"
      VCPKG_COMMIT: 9b75e789ece3f942159b8500584e35aafe3979ff
    steps:
      - uses: actions/checkout@v4

      - name: brew 构建工具
        run: brew install cmake ninja pkg-config autoconf automake libtool

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: 恢复 vcpkg 缓存
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg-cache
          key: vcpkg-${{ runner.os }}-arm64-osx-static-${{ hashFiles('ci/triplets/**') }}-v1
          restore-keys: |
            vcpkg-${{ runner.os }}-arm64-osx-static-

      - name: 安装 OpenCV（vcpkg）
        run: |
          code=0
          {
            if [ ! -x "$VCPKG_ROOT/vcpkg" ] && [ ! -f "$VCPKG_ROOT/vcpkg.exe" ]; then
              mkdir -p "$VCPKG_ROOT"
              git -C "$VCPKG_ROOT" init -q
              git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
              git -C "$VCPKG_ROOT" fetch -q --depth 1 origin "$VCPKG_COMMIT"
              git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD
              bash "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
            fi
            WS="$GITHUB_WORKSPACE"
            mkdir -p "$WS/vcpkg-cache"
            export VCPKG_BINARY_SOURCES="clear;files,$WS/vcpkg-cache,readwrite"
            "$VCPKG_ROOT/vcpkg" install "opencv4:$VCPKGRS_TRIPLET" \
              --overlay-triplets="$WS/ci/triplets" --clean-after-build
          } > vcpkg.txt 2>&1 || code=$?
          tail -30 vcpkg.txt
          exit $code

      - name: 前端依赖
        working-directory: app
        run: |
          code=0
          npm ci --registry=https://registry.npmjs.org > ../npm.txt 2>&1 || code=$?
          tail -15 ../npm.txt
          exit $code

      - name: 使用 crates.io
        run: rm -f .cargo/config.toml

      - name: 构建安装包
        working-directory: app
        run: |
          code=0
          rm -rf src-tauri/target/*/build/opencv-* src-tauri/target/*/build/vf-image-* src-tauri/target/*/build/vf-render-*
          npm run tauri build -- --bundles dmg > ../build.txt 2>&1 || code=$?
          tail -60 ../build.txt
          grep -nE "error(\[|:| )" ../build.txt | tail -40 || true
          exit $code

      - name: 提交日志
        if: always()
        run: |
          mkdir -p probe-logs
          {
            for f in vcpkg.txt npm.txt build.txt; do
              [ -f "$f" ] || continue
              echo "########## $f ##########"
              if [ "$f" = "build.txt" ]; then
                head -c 800000 "$f"
                echo
              elif [ "$f" = "vcpkg.txt" ]; then
                head -80 "$f"
                echo "########## $f (tail) ##########"
                tail -80 "$f"
              else
                tail -120 "$f"
              fi
              echo "########## $f (errors) ##########"
              grep -nE "error|Error|failed|FAILED|panicked|探测" "$f" | tail -100 || true
            done
          } > probe-logs/macos-build.txt || echo "无日志" > probe-logs/macos-build.txt
          git config user.name probe
          git config user.email probe@local
          git add probe-logs/macos-build.txt
          git diff --cached --quiet || git commit -m "probe log: macos build"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:probe-log-macos-build

  linux-build:
    name: Linux 全链路至 tauri build
    runs-on: ubuntu-22.04
    timeout-minutes: 140
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKGRS_TRIPLET: x64-linux-static
      VCPKGRS_DYNAMIC: "0"
      OPENCV_MSVC_CRT: dynamic
      OPENCV_VERSION: "4.10.0"
      VCPKG_COMMIT: 9b75e789ece3f942159b8500584e35aafe3979ff
    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf pkg-config cmake ninja-build \
            clang libclang-dev llvm-dev build-essential python3-pip \
            autoconf autoconf-archive automake libtool

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: 恢复 vcpkg 缓存
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg-cache
          key: vcpkg-${{ runner.os }}-x64-linux-static-${{ hashFiles('ci/triplets/**') }}-v1
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-linux-static-

      - name: 安装 OpenCV（vcpkg）
        run: |
          code=0
          {
            if [ ! -x "$VCPKG_ROOT/vcpkg" ] && [ ! -f "$VCPKG_ROOT/vcpkg.exe" ]; then
              mkdir -p "$VCPKG_ROOT"
              git -C "$VCPKG_ROOT" init -q
              git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
              git -C "$VCPKG_ROOT" fetch -q --depth 1 origin "$VCPKG_COMMIT"
              git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD
              bash "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
            fi
            WS="$GITHUB_WORKSPACE"
            mkdir -p "$WS/vcpkg-cache"
            export VCPKG_BINARY_SOURCES="clear;files,$WS/vcpkg-cache,readwrite"
            "$VCPKG_ROOT/vcpkg" install "opencv4:$VCPKGRS_TRIPLET" \
              --overlay-triplets="$WS/ci/triplets" --clean-after-build
          } > vcpkg.txt 2>&1 || code=$?
          tail -30 vcpkg.txt
          exit $code

      - name: 前端依赖
        working-directory: app
        run: |
          code=0
          npm ci --registry=https://registry.npmjs.org > ../npm.txt 2>&1 || code=$?
          tail -15 ../npm.txt
          exit $code

      - name: 使用 crates.io
        run: rm -f .cargo/config.toml

      - name: 构建安装包
        working-directory: app
        run: |
          code=0
          rm -rf src-tauri/target/*/build/opencv-* src-tauri/target/*/build/vf-image-* src-tauri/target/*/build/vf-render-*
          npm run tauri build -- --bundles deb,appimage > ../build.txt 2>&1 || code=$?
          tail -60 ../build.txt
          grep -nE "error(\[|:| )" ../build.txt | tail -40 || true
          exit $code

      - name: 提交日志
        if: always()
        run: |
          mkdir -p probe-logs
          {
            for f in vcpkg.txt npm.txt build.txt; do
              [ -f "$f" ] || continue
              echo "########## $f ##########"
              if [ "$f" = "build.txt" ]; then
                head -c 800000 "$f"
                echo
              elif [ "$f" = "vcpkg.txt" ]; then
                head -80 "$f"
                echo "########## $f (tail) ##########"
                tail -80 "$f"
              else
                tail -120 "$f"
              fi
              echo "########## $f (errors) ##########"
              grep -nE "error|Error|failed|FAILED|panicked|探测" "$f" | tail -100 || true
            done
          } > probe-logs/linux-build.txt || echo "无日志" > probe-logs/linux-build.txt
          git config user.name probe
          git config user.email probe@local
          git add probe-logs/linux-build.txt
          git diff --cached --quiet || git commit -m "probe log: linux build"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:probe-log-linux-build

  windows-build:
    name: Windows 全链路至 tauri build
    runs-on: windows-latest
    timeout-minutes: 140
    defaults:
      run:
        shell: bash
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKGRS_TRIPLET: x64-windows-static-md
      VCPKGRS_DYNAMIC: "0"
      OPENCV_MSVC_CRT: dynamic
      OPENCV_VERSION: "4.10.0"
      VCPKG_COMMIT: 9b75e789ece3f942159b8500584e35aafe3979ff
    steps:
      - uses: actions/checkout@v4

      - name: 安装 LLVM（opencv 绑定生成：MSVC 14.52 的 STL 要求 Clang >= 22）
        run: |
          choco upgrade llvm --no-progress -y --force || choco install llvm --no-progress -y --force
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: 恢复 vcpkg 缓存
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg-cache
          key: vcpkg-${{ runner.os }}-x64-windows-static-md-${{ hashFiles('ci/triplets/**') }}-v1
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-windows-static-md-

      - name: 安装 OpenCV（vcpkg）
        run: |
          code=0
          {
            if [ ! -x "$VCPKG_ROOT/vcpkg" ] && [ ! -f "$VCPKG_ROOT/vcpkg.exe" ]; then
              mkdir -p "$VCPKG_ROOT"
              git -C "$VCPKG_ROOT" init -q
              git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
              git -C "$VCPKG_ROOT" fetch -q --depth 1 origin "$VCPKG_COMMIT"
              git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD
              if [ "$RUNNER_OS" = "Windows" ]; then
                # msys2-runtime-3.5.4-2 已被所有镜像清除：预置 NJU 相邻版本进
                # vcpkg 下载缓存并同步 SHA512；相对路径规避反斜杠解析差异。
                mkdir -p vcpkg/downloads
                curl -sfL --retry 3 -o msysrt.tmp "https://mirror.nju.edu.cn/msys2/msys/x86_64/msys2-runtime-3.5.7-4-x86_64.pkg.tar.zst"
                newsha=$(sha512sum msysrt.tmp | cut -d' ' -f1)
                echo "preseed newsha=$newsha"
                cp msysrt.tmp vcpkg/downloads/msys2-msys2-runtime-3.5.4-2-x86_64.pkg.tar.zst
                sed -i "s|070aeb43385beb0e3f8d5fb28909469765116c222d53c2614f5f080be879eef0b78258334b35e8cda7625d8704efc89133f8b8fa78f309c5d680ae270efdaba8|$newsha|" vcpkg/scripts/cmake/vcpkg_acquire_msys.cmake
                grep -q "$newsha" vcpkg/scripts/cmake/vcpkg_acquire_msys.cmake || { echo "FATAL: SHA512 patch not applied"; exit 1; }
                test -s vcpkg/downloads/msys2-msys2-runtime-3.5.4-2-x86_64.pkg.tar.zst || { echo "FATAL: preseed file missing"; exit 1; }
                ls -la vcpkg/downloads/msys2-*
              fi
              if [ "$RUNNER_OS" = "Windows" ]; then
                cmd //c "$(cygpath -w "$VCPKG_ROOT\\bootstrap-vcpkg.bat") -disableMetrics"
              else
                bash "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
              fi
            fi
            WS="$GITHUB_WORKSPACE"
            if [ "$RUNNER_OS" = "Windows" ]; then WS="$(cygpath -m "$WS")"; fi
            mkdir -p "$WS/vcpkg-cache"
            export VCPKG_BINARY_SOURCES="clear;files,$WS/vcpkg-cache,readwrite"
            "$VCPKG_ROOT/vcpkg" install "opencv4:$VCPKGRS_TRIPLET" \
              --overlay-triplets="$WS/ci/triplets" --clean-after-build
          } > vcpkg.txt 2>&1 || code=$?
          tail -30 vcpkg.txt
          exit $code

      - name: 前端依赖
        working-directory: app
        run: |
          code=0
          npm ci --registry=https://registry.npmjs.org > ../npm.txt 2>&1 || code=$?
          tail -15 ../npm.txt
          exit $code

      - name: 使用 crates.io
        run: rm -f .cargo/config.toml

      - name: 构建安装包
        working-directory: app
        run: |
          code=0
          rm -rf src-tauri/target/*/build/opencv-* src-tauri/target/*/build/vf-image-* src-tauri/target/*/build/vf-render-*
          npm run tauri build -- --bundles nsis > ../build.txt 2>&1 || code=$?
          tail -60 ../build.txt
          grep -nE "error(\[|:| )" ../build.txt | tail -40 || true
          exit $code

      - name: 提交日志
        if: always()
        run: |
          mkdir -p probe-logs
          {
            for f in vcpkg.txt npm.txt build.txt; do
              [ -f "$f" ] || continue
              echo "########## $f ##########"
              if [ "$f" = "build.txt" ]; then
                head -c 800000 "$f"
                echo
              elif [ "$f" = "vcpkg.txt" ]; then
                head -80 "$f"
                echo "########## $f (tail) ##########"
                tail -80 "$f"
              else
                tail -120 "$f"
              fi
              echo "########## $f (errors) ##########"
              grep -nE "error|Error|failed|FAILED|panicked|探测" "$f" | tail -100 || true
            done
          } > probe-logs/windows-build.txt || echo "无日志" > probe-logs/windows-build.txt
          git config user.name probe
          git config user.email probe@local
          git add probe-logs/windows-build.txt
          git diff --cached --quiet || git commit -m "probe log: windows build"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:probe-log-windows-build
