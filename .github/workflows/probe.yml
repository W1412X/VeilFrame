# 诊断（probe 分支）：在与 Release 相同的环境复现两处失败，把日志尾巴
# 提交到 probe-log-* 分支（绕开 Actions 日志的管理员权限）。
# 日志分支的提交不会触发本 workflow（只监听 probe 分支）。
name: Probe

on:
  push:
    branches: [probe]

permissions:
  contents: write

jobs:
  windows-ort:
    name: 复现 Windows fetch-ort
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 运行 fetch-ort.sh windows
        run: |
          bash scripts/ci/fetch-ort.sh windows probe-out > probe-win.log 2>&1 || echo "exit=$?" >> probe-win.log
          tail -40 probe-win.log

      - name: 提交日志
        if: always()
        run: |
          mkdir -p probe-logs
          cp probe-win.log probe-logs/windows-ort.log 2>/dev/null || echo "无日志" > probe-logs/windows-ort.log
          git config user.name probe
          git config user.email probe@local
          git add probe-logs/windows-ort.log
          git diff --cached --quiet || git commit -m "probe log: windows ort"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:probe-log-windows

  linux-vcpkg:
    name: 复现 Linux vcpkg OpenCV
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKGRS_TRIPLET: x64-linux-static
      VCPKGRS_DYNAMIC: "0"
      OPENCV_MSVC_CRT: md
    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf pkg-config cmake ninja-build \
            clang libclang-dev llvm-dev build-essential python3-pip

      - name: vcpkg 安装 opencv4
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          bash "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          "$VCPKG_ROOT/vcpkg" install "opencv4:$VCPKGRS_TRIPLET" \
            --overlay-triplets="$GITHUB_WORKSPACE/ci/triplets" > vcpkg.log 2>&1 \
            || echo "exit=$?" >> vcpkg.log
          { echo "===== tail ====="; tail -150 vcpkg.log; echo "===== errors ====="; grep -iE "error|failed" vcpkg.log | tail -80; } > vcpkg-diag.txt || true
          cat vcpkg-diag.txt

      - name: 提交日志
        if: always()
        run: |
          mkdir -p probe-logs
          cp vcpkg-diag.txt probe-logs/linux-vcpkg.txt 2>/dev/null || echo "无日志" > probe-logs/linux-vcpkg.txt
          git config user.name probe
          git config user.email probe@local
          git add probe-logs/linux-vcpkg.txt
          git diff --cached --quiet || git commit -m "probe log: linux vcpkg"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:probe-log-linux

  macos-ort:
    name: 复现 macOS fetch-ort 与 npm ffmpeg
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 运行 fetch-ort.sh macos 与 npm 静态 ffmpeg
        run: |
          bash scripts/ci/fetch-ort.sh macos probe-out > probe-mac.log 2>&1 || echo "exit=$?" >> probe-mac.log
          (cd app && npm install --no-save --package-lock=false --registry=https://registry.npmjs.org \
            ffmpeg-static@5.3.0 ffprobe-static@3.1.0) >> probe-mac.log 2>&1 || echo "npm exit=$?" >> probe-mac.log
          ls -la app/node_modules/ffmpeg-static/ffmpeg app/node_modules/ffprobe-static/bin/darwin/arm64/ffprobe >> probe-mac.log 2>&1 || true
          tail -40 probe-mac.log

      - name: 提交日志
        if: always()
        run: |
          mkdir -p probe-logs
          cp probe-mac.log probe-logs/macos-ort.log 2>/dev/null || echo "无日志" > probe-logs/macos-ort.log
          git config user.name probe
          git config user.email probe@local
          git add probe-logs/macos-ort.log
          git diff --cached --quiet || git commit -m "probe log: macos ort"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:probe-log-macos
