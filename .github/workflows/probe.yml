# 一次性诊断：确认 ONNX Runtime / ffmpeg 预编译包的真实下载来源。
# 只推到 probe 分支触发。每个探测步骤 continue-on-error，
# 结论看 API 里 steps[].outcome（failure = 资产不存在），一步跑完全部探测。
name: Probe

on:
  push:
    branches: [probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: 对照 ripgrep（应 OK）
        continue-on-error: true
        run: curl -sfIL -o /dev/null --retry 2 "https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz"

      - name: ORT GitHub linux 1.20.1
        continue-on-error: true
        run: curl -sfIL -o /dev/null --retry 2 "https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-1.20.1.tgz"

      - name: ORT GitHub win 1.20.1
        continue-on-error: true
        run: curl -sfIL -o /dev/null --retry 2 "https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-win-x64-1.20.1.zip"

      - name: ORT GitHub osx 1.20.1
        continue-on-error: true
        run: curl -sfIL -o /dev/null --retry 2 "https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-osx-arm64-1.20.1.tgz"

      - name: ORT GitHub linux 1.19.2
        continue-on-error: true
        run: curl -sfIL -o /dev/null --retry 2 "https://github.com/microsoft/onnxruntime/releases/download/v1.19.2/onnxruntime-linux-x64-1.19.2.tgz"

      - name: ORT GitHub linux 1.20.0
        continue-on-error: true
        run: curl -sfIL -o /dev/null --retry 2 "https://github.com/microsoft/onnxruntime/releases/download/v1.20.0/onnxruntime-linux-x64-1.20.0.tgz"

      - name: ORT GitHub linux 1.21.0
        continue-on-error: true
        run: curl -sfIL -o /dev/null --retry 2 "https://github.com/microsoft/onnxruntime/releases/download/v1.21.0/onnxruntime-linux-x64-1.21.0.tgz"

      - name: ORT tag 1.20.1 API 查询
        continue-on-error: true
        run: curl -sf --retry 2 -o /dev/null "https://api.github.com/repos/microsoft/onnxruntime/releases/tags/v1.20.1"

      - name: ffmpeg-static linux x64
        continue-on-error: true
        run: curl -sfIL -o /dev/null --retry 2 "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-linux-x64.gz"

      - name: ffmpeg-static win32 x64
        continue-on-error: true
        run: curl -sfIL -o /dev/null --retry 2 "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64.gz"

      - name: ffmpeg-static darwin arm64
        continue-on-error: true
        run: curl -sfIL -o /dev/null --retry 2 "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64.gz"

      - name: NuGet 1.20.1 三平台原生库齐备
        continue-on-error: true
        run: |
          curl -sfL --retry 3 -o /tmp/ort.nupkg "https://www.nuget.org/api/v2/package/Microsoft.ML.OnnxRuntime/1.20.1"
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('/tmp/ort.nupkg')
          need = [
              'runtimes/linux-x64/native/libonnxruntime.so',
              'runtimes/win-x64/native/onnxruntime.dll',
              'runtimes/osx-arm64/native/libonnxruntime.dylib',
          ]
          have = set(z.namelist())
          for n in need:
              print(('OK  ' if n in have else 'MISS'), n)
          assert all(n in have for n in need), 'missing natives'
          PY

      - name: PyPI 1.20.1 manylinux wheel 含 libonnxruntime
        continue-on-error: true
        run: |
          url=$(curl -sS --retry 2 "https://pypi.org/pypi/onnxruntime/1.20.1/json" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(u['url'] for u in d['urls'] if 'manylinux' in u['filename'] and 'x86_64' in u['filename']))")
          echo "wheel: $url"
          curl -sfL --retry 3 -o /tmp/ort.whl "$url"
          python3 - <<'PY'
          import zipfile
          z = zipfile.ZipFile('/tmp/ort.whl')
          capi = [n for n in z.namelist() if '/capi/' in n and 'libonnxruntime' in n]
          print('\n'.join(capi) or 'MISS')
          assert capi, 'wheel 内未见 libonnxruntime'
          PY
