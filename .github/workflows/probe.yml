# 诊断（probe 分支）：只验 Windows fetch-ort 的相对临时路径修复。
# 日志提交到 probe-log-windows 分支（*.log 被 gitignore，用 .txt）。
name: Probe

on:
  push:
    branches: [probe]

permissions:
  contents: write

jobs:
  windows-ort:
    name: 验证 Windows fetch-ort（相对临时路径）
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: 运行 fetch-ort.sh windows
        run: |
          code=0
          bash scripts/ci/fetch-ort.sh windows probe-out > probe-win.txt 2>&1 || code=$?
          tail -40 probe-win.txt
          exit $code

      - name: 提交日志
        if: always()
        run: |
          mkdir -p probe-logs
          cp probe-win.txt probe-logs/windows-ort.txt 2>/dev/null || echo "无日志" > probe-logs/windows-ort.txt
          git config user.name probe
          git config user.email probe@local
          git add probe-logs/windows-ort.txt
          git diff --cached --quiet || git commit -m "probe log: windows ort"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:probe-log-windows
