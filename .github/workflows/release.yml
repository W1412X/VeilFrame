name: Release

# 打 tag（v*）或手动触发时，构建 Windows / macOS / Linux 安装包。
# 依赖准备：vcpkg 静态 OpenCV、ONNX Runtime、静态 ffmpeg/ffprobe、PP-OCRv5 模型与字典。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建 ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            triplet: x64-linux-static
            bundles: deb,appimage
            ort_plat: linux
            ffmpeg_src: ffmpeg
            ffprobe_src: bin/linux/x64/ffprobe
            exe: ""
          - os: windows-latest
            platform: windows-x64
            triplet: x64-windows-static-md
            bundles: nsis
            ort_plat: windows
            ffmpeg_src: ffmpeg.exe
            ffprobe_src: bin/win32/x64/ffprobe.exe
            exe: ".exe"
          - os: macos-15
            platform: macos-arm64
            triplet: arm64-osx-static
            bundles: dmg
            ort_plat: macos
            ffmpeg_src: ffmpeg
            ffprobe_src: bin/darwin/arm64/ffprobe
            exe: ""
    defaults:
      run:
        shell: bash
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKGRS_TRIPLET: ${{ matrix.triplet }}
      VCPKGRS_DYNAMIC: "0"
      # x64-windows-static-md = 静态库 + 动态 CRT(/MD)；opencv crate 只认 static/dynamic。
      OPENCV_MSVC_CRT: dynamic
      # 钉在 opencv4=4.10.0 的最后一个 commit：与本地 4.10、CI apt 4.5.4 同代，
      # 也是 opencv crate 0.93 实测能编的版本（4.14 在 Windows 上全新生成绑定会
      # 触发 GpuMat trait 错误）。升级 VCPKG_COMMIT 前先跑 probe 全链路探针。
      VCPKG_COMMIT: 9b75e789ece3f942159b8500584e35aafe3979ff
      # 与 VCPKG_COMMIT 钉住的 opencv4 版本保持一致（升级时同步改）；
      # Windows 的 vcpkg 树没有 opencv4.pc，显式指定比探测更可靠。
      OPENCV_VERSION: "4.10.0"

    steps:
      - uses: actions/checkout@v4

      - name: 安装 LLVM（opencv 绑定生成：MSVC 14.52 的 STL 要求 Clang ≥ 22）
        if: runner.os == 'Windows'
        run: |
          choco upgrade llvm --no-progress -y --force || choco install llvm --no-progress -y --force
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"

      - name: 释放 Linux 磁盘空间
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf pkg-config cmake ninja-build \
            clang libclang-dev llvm-dev build-essential python3-pip \
            autoconf autoconf-archive automake libtool

      - name: 安装 macOS 构建工具
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config autoconf automake libtool

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app/src-tauri -> target"

      - name: 恢复 vcpkg 缓存
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/installed
            vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ hashFiles('ci/triplets/**') }}-v1
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.triplet }}-

      - name: 安装 OpenCV（vcpkg 静态库）
        run: |
          if [ ! -x "$VCPKG_ROOT/vcpkg" ] && [ ! -f "$VCPKG_ROOT/vcpkg.exe" ]; then
            mkdir -p "$VCPKG_ROOT"
            git -C "$VCPKG_ROOT" init -q
            git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
            git -C "$VCPKG_ROOT" fetch -q --depth 1 origin "$VCPKG_COMMIT"
            git -C "$VCPKG_ROOT" checkout -q FETCH_HEAD
            if [ "$RUNNER_OS" = "Windows" ]; then
              # msys2-runtime-3.5.4-2 已被所有镜像清除：预置 NJU 相邻版本进
              # vcpkg 下载缓存（脚本先查缓存、哈希匹配即不走网络），并同步
              # 该条目 SHA512。用相对路径规避 Windows 反斜杠路径的解析差异。
              mkdir -p vcpkg/downloads
              curl -sfL --retry 3 -o msysrt.tmp "https://mirror.nju.edu.cn/msys2/msys/x86_64/msys2-runtime-3.5.7-4-x86_64.pkg.tar.zst"
              newsha=$(sha512sum msysrt.tmp | cut -d' ' -f1)
              echo "preseed newsha=$newsha"
              cp msysrt.tmp vcpkg/downloads/msys2-msys2-runtime-3.5.4-2-x86_64.pkg.tar.zst
              sed -i "s|070aeb43385beb0e3f8d5fb28909469765116c222d53c2614f5f080be879eef0b78258334b35e8cda7625d8704efc89133f8b8fa78f309c5d680ae270efdaba8|$newsha|" vcpkg/scripts/cmake/vcpkg_acquire_msys.cmake
              grep -q "$newsha" vcpkg/scripts/cmake/vcpkg_acquire_msys.cmake || { echo "FATAL: SHA512 补丁未生效"; exit 1; }
              test -s vcpkg/downloads/msys2-msys2-runtime-3.5.4-2-x86_64.pkg.tar.zst || { echo "FATAL: 预置缓存文件缺失"; exit 1; }
              ls -la vcpkg/downloads/msys2-*
            fi
            if [ "$RUNNER_OS" = "Windows" ]; then
              cmd //c "$(cygpath -w "$VCPKG_ROOT\\bootstrap-vcpkg.bat") -disableMetrics"
            else
              bash "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
            fi
          fi
          WS="$GITHUB_WORKSPACE"
          if [ "$RUNNER_OS" = "Windows" ]; then WS="$(cygpath -m "$WS")"; fi
          mkdir -p "$WS/vcpkg-cache"
          export VCPKG_BINARY_SOURCES="clear;files,$WS/vcpkg-cache,readwrite"
          "$VCPKG_ROOT/vcpkg" install "opencv4:$VCPKGRS_TRIPLET" \
            --overlay-triplets="$WS/ci/triplets" --clean-after-build

      - name: 安装前端依赖与静态 ffmpeg
        working-directory: app
        run: |
          npm ci --registry=https://registry.npmjs.org
          npm install --no-save --package-lock=false --registry=https://registry.npmjs.org \
            ffmpeg-static@5.3.0 ffprobe-static@3.1.0
          mkdir -p src-tauri/resources/bin src-tauri/resources/onnxruntime src-tauri/resources/models
          cp "node_modules/ffmpeg-static/${{ matrix.ffmpeg_src }}" "src-tauri/resources/bin/ffmpeg${{ matrix.exe }}"
          cp "node_modules/ffprobe-static/${{ matrix.ffprobe_src }}" "src-tauri/resources/bin/ffprobe${{ matrix.exe }}"
          chmod +x "src-tauri/resources/bin/ffmpeg${{ matrix.exe }}" "src-tauri/resources/bin/ffprobe${{ matrix.exe }}"

      - name: 下载 ONNX Runtime
        run: bash scripts/ci/fetch-ort.sh ${{ matrix.ort_plat }} app/src-tauri/resources/onnxruntime

      - name: 下载 PP-OCRv5 模型
        run: |
          fetch() {
            local out="$1"; shift
            for url in "$@"; do
              if curl -L --fail --retry 3 --retry-delay 2 -o "$out" "$url"; then return 0; fi
            done
            echo "下载失败: $out" >&2
            return 1
          }
          DET=app/src-tauri/resources/models/det_v5.onnx
          REC=app/src-tauri/resources/models/rec_v5.onnx
          fetch "$DET" \
            "https://huggingface.co/breezedeus/cnstd-ppocr-ch_PP-OCRv5_det/resolve/main/ch_PP-OCRv5_det_infer.onnx" \
            "https://hf-mirror.com/breezedeus/cnstd-ppocr-ch_PP-OCRv5_det/resolve/main/ch_PP-OCRv5_det_infer.onnx"
          fetch "$REC" \
            "https://huggingface.co/breezedeus/cnocr-ppocr-ch_PP-OCRv5/resolve/main/ch_PP-OCRv5_rec_infer.onnx" \
            "https://hf-mirror.com/breezedeus/cnocr-ppocr-ch_PP-OCRv5/resolve/main/ch_PP-OCRv5_rec_infer.onnx"
          test -s app/src-tauri/resources/models/ppocr_keys_v5_onnx.txt
          ls -lh app/src-tauri/resources/bin app/src-tauri/resources/onnxruntime app/src-tauri/resources/models

      - name: 使用 crates.io（CI 不走国内镜像）
        run: rm -f .cargo/config.toml

      - name: 构建安装包
        working-directory: app
        run: |
          # rust-cache 可能残留其他 OpenCV 版本生成的绑定，构建前强制重建
          # opencv 及依赖其 cfg 的 crate，保证绑定与 cfg 同源于当前 vcpkg 树。
          rm -rf src-tauri/target/*/build/opencv-* src-tauri/target/*/build/vf-image-* src-tauri/target/*/build/vf-render-*
          npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: VeilFrame-${{ matrix.platform }}
          path: app/src-tauri/target/release/bundle/**
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: false
